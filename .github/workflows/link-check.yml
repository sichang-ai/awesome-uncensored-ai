name: link-check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 1 */3 *'   # 每季度一次，与数据复核节奏对齐
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 Markdown 链接
        uses: lycheeverse/lychee-action@v2
        with:
          # 403/429 计入通过：本仓库大量链接指向有 Cloudflare 或反爬的站点
          # （Janitor、Chub、Crushon），它们对 CI 必然返回 403，那不代表链接失效。
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,403,429
            --exclude-path LICENSE
            './**/*.md'
          fail: true
